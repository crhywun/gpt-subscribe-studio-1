[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gss-core"
version = "0.1.0"
description = "共享底座：脱敏日志、配置加载、传输工具（gpt-subscribe-studio）"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "curl_cffi>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gss_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/gss_core/sentinel_assets" = "gss_core/sentinel_assets"
