[project]
name = "gpt-subscribe-studio"
version = "0.1.0"
description = "自托管的 ChatGPT 订阅代开编排与交付平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "curl_cffi>=0.16.1",
]

[tool.uv]
# 根项目是「虚拟工作区」，不打包自身；各 service / package 独立成包。
package = false

[tool.pytest.ini_options]
pythonpath = [
    "packages/contracts/src",
    "packages/core/src",
    "services/account/src",
    "services/checkout/src",
    "services/payment/src",
    "services/api/src",
    "services/orchestrator/src",
]
testpaths = ["tests"]
addopts = "-q --strict-markers"
